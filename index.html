<!DOCTYPE html>
<html lang="en" data-theme="dark-glass">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudFolio — Cloud Resume Builder & Portfolio</title>
  <meta name="description" content="Build professional printable resumes and publish interactive cloud-hosted web portfolios with live preview, multi-theme engine, and PDF export." />
  <meta name="keywords" content="resume builder, portfolio website, cloud hosting, vercel, PDF export, career" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☁️</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* ═══════════════════════════════════════════
       THEME VARIABLES
    ═══════════════════════════════════════════ */
    :root,[data-theme="dark-glass"]{
      --bg-base:#07090f;--bg-surface:#0f1624;--bg-card:rgba(15,22,36,.8);
      --bg-input:rgba(255,255,255,.05);--border:rgba(255,255,255,.1);
      --text-primary:#f0f4ff;--text-secondary:#8898aa;--text-muted:#4a5568;
      --accent:#38bdf8;--accent-end:#818cf8;--accent-third:#c084fc;
      --accent-grad:linear-gradient(135deg,#38bdf8,#818cf8 55%,#c084fc);
      --accent-glow:rgba(56,189,248,.2);
      --badge-bg:rgba(56,189,248,.12);--badge-text:#38bdf8;--badge-border:rgba(56,189,248,.25);
      --shadow:rgba(0,0,0,.45);--blur:blur(18px);
      --resume-bg:#1a2236;--resume-text:#e8eeff;--resume-border:#2d3a52;
      --success:rgba(16,185,129,.15);--success-text:#10b981;
      --error:rgba(239,68,68,.15);--error-text:#ef4444;
    }
    [data-theme="corporate"]{
      --bg-base:#f0f4f8;--bg-surface:#ffffff;--bg-card:#ffffff;
      --bg-input:#f7fafc;--border:#e2e8f0;
      --text-primary:#0f172a;--text-secondary:#475569;--text-muted:#94a3b8;
      --accent:#2563eb;--accent-end:#1e40af;--accent-third:#3b82f6;
      --accent-grad:linear-gradient(135deg,#2563eb,#1d4ed8);
      --accent-glow:rgba(37,99,235,.12);
      --badge-bg:#eff6ff;--badge-text:#1d4ed8;--badge-border:#bfdbfe;
      --shadow:rgba(15,23,42,.07);--blur:none;
      --resume-bg:#ffffff;--resume-text:#0f172a;--resume-border:#e2e8f0;
    }
    [data-theme="neon"]{
      --bg-base:#08001c;--bg-surface:#10002e;--bg-card:rgba(20,0,50,.8);
      --bg-input:rgba(255,255,255,.04);--border:rgba(236,72,153,.2);
      --text-primary:#fff;--text-secondary:#c4b5fd;--text-muted:#7c3aed;
      --accent:#ec4899;--accent-end:#a855f7;--accent-third:#f472b6;
      --accent-grad:linear-gradient(135deg,#f43f5e,#ec4899 50%,#a855f7);
      --accent-glow:rgba(236,72,153,.25);
      --badge-bg:rgba(236,72,153,.12);--badge-text:#f472b6;--badge-border:rgba(236,72,153,.35);
      --shadow:rgba(236,72,153,.15);--blur:blur(20px);
      --resume-bg:#1a0035;--resume-text:#fdf4ff;--resume-border:#4c1d95;
    }

    /* ═══════════════════════════════════════════
       RESET & BASE
    ═══════════════════════════════════════════ */
    *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
    html{scroll-behavior:smooth}
    body{
      font-family:'Inter',system-ui,sans-serif;
      background:var(--bg-base);color:var(--text-primary);
      min-height:100vh;overflow-x:hidden;
      transition:background .3s,color .3s;
    }
    h1,h2,h3,h4{font-family:'Outfit',sans-serif;letter-spacing:-.02em}
    a{color:var(--accent);text-decoration:none}
    button,select,input,textarea{font-family:inherit}
    input,textarea,select{
      width:100%;padding:.65rem .9rem;
      border-radius:8px;border:1.5px solid var(--border);
      background:var(--bg-input);color:var(--text-primary);
      font-size:.9rem;outline:none;
      transition:border-color .2s,box-shadow .2s;
    }
    input:focus,textarea:focus,select:focus{
      border-color:var(--accent);
      box-shadow:0 0 0 3px var(--accent-glow);
    }
    input.error-field,textarea.error-field{border-color:var(--error-text)!important}
    textarea{resize:vertical;min-height:72px;line-height:1.5}

    /* ═══════════════════════════════════════════
       LAYOUT
    ═══════════════════════════════════════════ */
    #root{display:flex;flex-direction:column;min-height:100vh}

    /* ─── Navbar ─── */
    .navbar{
      display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.75rem;
      padding:.75rem 1.5rem;
      background:var(--bg-surface);border-bottom:1px solid var(--border);
      position:sticky;top:0;z-index:200;
      backdrop-filter:var(--blur);
    }
    .nav-brand{display:flex;align-items:center;gap:.7rem;cursor:pointer}
    .nav-logo{
      width:38px;height:38px;border-radius:10px;
      background:var(--accent-grad);
      display:flex;align-items:center;justify-content:center;
      font-size:1.2rem;box-shadow:0 4px 14px var(--accent-glow);
      flex-shrink:0;
    }
    .nav-title{font-size:1.2rem;font-weight:800;background:var(--accent-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .nav-sub{font-size:.72rem;color:var(--text-secondary);margin-top:.05rem}
    .nav-right{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}

    /* ─── Landing Page ─── */
    .landing{
      display:flex;flex-direction:column;align-items:center;
      padding:5rem 1.5rem 4rem;text-align:center;flex:1;
    }
    .landing-badge{
      display:inline-flex;align-items:center;gap:.5rem;
      padding:.35rem .85rem;border-radius:20px;
      background:var(--badge-bg);color:var(--badge-text);border:1px solid var(--badge-border);
      font-size:.8rem;font-weight:700;margin-bottom:1.5rem;letter-spacing:.03em;
    }
    .landing h1{font-size:clamp(2.2rem,5vw,4rem);font-weight:900;line-height:1.1;max-width:800px}
    .landing h1 span{background:var(--accent-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .landing-sub{
      max-width:600px;margin:1.25rem auto 2.5rem;
      color:var(--text-secondary);font-size:1.1rem;line-height:1.6;
    }
    .landing-actions{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center}
    .features-grid{
      display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
      gap:1.25rem;margin-top:4rem;width:100%;max-width:960px;text-align:left;
    }
    .feature-card{
      background:var(--bg-card);border:1px solid var(--border);
      border-radius:14px;padding:1.5rem;
      backdrop-filter:var(--blur);
      transition:transform .2s,border-color .2s,box-shadow .2s;
    }
    .feature-card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 8px 24px var(--shadow)}
    .feature-icon{font-size:2rem;margin-bottom:.85rem}
    .feature-title{font-size:1.05rem;font-weight:700;margin-bottom:.4rem}
    .feature-desc{font-size:.875rem;color:var(--text-secondary);line-height:1.55}

    /* ─── Builder Layout ─── */
    .builder{display:flex;flex:1;height:calc(100vh - 65px);overflow:hidden}
    @media(max-width:900px){.builder{flex-direction:column;height:auto;overflow:visible}}
    .editor-panel{
      width:46%;min-width:320px;
      background:var(--bg-surface);border-right:1px solid var(--border);
      display:flex;flex-direction:column;overflow:hidden;
    }
    @media(max-width:900px){.editor-panel{width:100%;min-height:auto}}
    .preview-panel{
      flex:1;background:var(--bg-base);
      display:flex;flex-direction:column;overflow:hidden;
    }
    @media(max-width:900px){.preview-panel{min-height:600px}}

    /* ─── Tab Bar ─── */
    .tab-bar{
      display:flex;gap:.25rem;padding:.6rem .85rem;
      background:var(--bg-base);border-bottom:1px solid var(--border);
      overflow-x:auto;scrollbar-width:none;flex-shrink:0;
    }
    .tab-bar::-webkit-scrollbar{display:none}
    .tab-btn{
      padding:.42rem .75rem;border-radius:7px;font-size:.78rem;font-weight:600;
      color:var(--text-secondary);background:transparent;border:none;cursor:pointer;
      white-space:nowrap;display:flex;align-items:center;gap:.35rem;
      transition:all .15s;
    }
    .tab-btn:hover{color:var(--text-primary);background:var(--bg-card)}
    .tab-btn.active{background:var(--badge-bg);color:var(--badge-text);border:1px solid var(--badge-border)}

    /* ─── Form Area ─── */
    .form-scroll{flex:1;overflow-y:auto;padding:1.25rem;display:flex;flex-direction:column;gap:1.1rem}
    .form-scroll::-webkit-scrollbar{width:4px}
    .form-scroll::-webkit-scrollbar-track{background:transparent}
    .form-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
    .form-group{display:flex;flex-direction:column;gap:.35rem}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:.85rem}
    @media(max-width:600px){.form-row{grid-template-columns:1fr}}
    label{font-size:.78rem;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.04em}
    .label-row{display:flex;align-items:center;justify-content:space-between}
    .field-error{font-size:.75rem;color:var(--error-text);margin-top:.2rem;display:flex;align-items:center;gap:.3rem}

    /* ─── Dynamic Item Cards ─── */
    .item-card{
      background:var(--bg-card);border:1px solid var(--border);
      border-radius:12px;padding:1.1rem;
      display:flex;flex-direction:column;gap:.85rem;
      backdrop-filter:var(--blur);
    }
    .item-card-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
    .item-card-label{font-size:.9rem;font-weight:700}

    /* ─── Section Header in form ─── */
    .section-head{
      display:flex;align-items:center;justify-content:space-between;
      margin-bottom:-.2rem;
    }
    .section-title-small{font-size:.95rem;font-weight:700;color:var(--text-primary)}

    /* ─── Preview Header ─── */
    .preview-bar{
      display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem;
      padding:.7rem 1.1rem;background:var(--bg-surface);border-bottom:1px solid var(--border);
      flex-shrink:0;
    }
    .preview-bar-left{display:flex;align-items:center;gap:.6rem}
    .preview-badge{
      font-size:.72rem;font-weight:700;padding:.25rem .55rem;border-radius:5px;
      background:var(--badge-bg);color:var(--badge-text);border:1px solid var(--badge-border);
    }
    .view-toggle{display:flex;background:var(--bg-input);border-radius:8px;padding:.2rem;gap:.2rem}
    .vt-btn{
      padding:.38rem .8rem;border-radius:6px;font-size:.78rem;font-weight:700;
      border:none;background:transparent;color:var(--text-secondary);cursor:pointer;
      transition:all .15s;
    }
    .vt-btn.active{background:var(--accent-grad);color:#fff;box-shadow:0 2px 8px var(--accent-glow)}

    /* ─── Preview Scroll ─── */
    .preview-scroll{flex:1;overflow-y:auto;padding:1.25rem}
    .preview-scroll::-webkit-scrollbar{width:4px}
    .preview-scroll::-webkit-scrollbar-track{background:transparent}
    .preview-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

    /* ─── Resume Document ─── */
    .resume-doc{
      background:var(--resume-bg);color:var(--resume-text);
      border:1px solid var(--resume-border);border-radius:12px;
      padding:2.25rem;max-width:760px;margin:0 auto;width:100%;
      box-shadow:0 12px 40px var(--shadow);
      font-size:.88rem;line-height:1.55;
    }
    .resume-header-section{
      border-bottom:2.5px solid var(--accent);padding-bottom:1.1rem;margin-bottom:1.25rem;
    }
    .resume-name{font-size:2rem;font-weight:800;color:var(--resume-text)}
    .resume-title-line{font-size:1.05rem;color:var(--accent);font-weight:600;margin:.15rem 0}
    .resume-contact-row{
      display:flex;flex-wrap:wrap;gap:.75rem 1.5rem;margin-top:.7rem;
      font-size:.82rem;color:var(--text-secondary);
    }
    .resume-contact-item{display:flex;align-items:center;gap:.3rem}
    .resume-contact-item a{color:inherit;text-decoration:none}
    .resume-section{margin-bottom:1.35rem}
    .resume-section-title{
      font-size:.85rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;
      color:var(--accent);border-bottom:1px solid var(--resume-border);
      padding-bottom:.3rem;margin-bottom:.8rem;
    }
    .resume-item{margin-bottom:.9rem}
    .resume-item-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:.25rem}
    .resume-item-title{font-weight:700;font-size:.92rem}
    .resume-item-right{font-size:.8rem;color:var(--text-secondary)}
    .resume-item-sub{font-size:.82rem;color:var(--text-secondary);margin:.15rem 0 .3rem}
    .resume-item-desc{font-size:.85rem;color:var(--resume-text);line-height:1.55}
    .resume-highlights{padding-left:1.1rem;margin-top:.3rem;font-size:.83rem}
    .resume-highlights li{margin-bottom:.2rem}
    .skills-wrap{display:flex;flex-wrap:wrap;gap:.45rem}
    .skill-chip{
      padding:.28rem .65rem;border-radius:6px;font-size:.78rem;font-weight:600;
      background:var(--badge-bg);color:var(--badge-text);border:1px solid var(--badge-border);
    }
    .cert-item{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;margin-bottom:.5rem}

    /* ─── Portfolio View ─── */
    .portfolio{display:flex;flex-direction:column;gap:1.75rem;max-width:820px;margin:0 auto;width:100%}
    .portfolio-hero{
      background:var(--bg-card);border:1px solid var(--border);
      border-radius:18px;padding:2.5rem 2rem;text-align:center;
      position:relative;overflow:hidden;backdrop-filter:var(--blur);
    }
    .portfolio-hero::before{
      content:'';position:absolute;top:-60%;left:-30%;
      width:160%;height:200%;
      background:radial-gradient(circle,var(--accent-glow) 0%,transparent 65%);
      pointer-events:none;
    }
    .portfolio-avatar{
      width:88px;height:88px;border-radius:50%;
      background:var(--accent-grad);display:flex;align-items:center;justify-content:center;
      font-size:2.2rem;font-weight:900;color:#fff;margin:0 auto 1.1rem;
      box-shadow:0 8px 30px var(--accent-glow);letter-spacing:-.02em;
    }
    .portfolio-name{font-size:2.1rem;font-weight:900}
    .portfolio-role{font-size:1.1rem;color:var(--accent);font-weight:600;margin:.3rem 0}
    .portfolio-bio{
      max-width:580px;margin:.85rem auto 1.5rem;
      color:var(--text-secondary);font-size:.95rem;line-height:1.6;
    }
    .portfolio-links{display:flex;gap:.75rem;flex-wrap:wrap;justify-content:center}
    .portfolio-card{
      background:var(--bg-card);border:1px solid var(--border);
      border-radius:14px;padding:1.35rem;backdrop-filter:var(--blur);
      transition:transform .2s,border-color .2s,box-shadow .2s;
    }
    .portfolio-card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 10px 28px var(--shadow)}
    .portfolio-card-title{font-size:1rem;font-weight:700;margin-bottom:.85rem;display:flex;align-items:center;gap:.5rem}
    .proj-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}
    .proj-card{
      background:var(--bg-input);border:1px solid var(--border);
      border-radius:10px;padding:1.1rem;
      display:flex;flex-direction:column;justify-content:space-between;gap:.75rem;
      transition:border-color .2s;
    }
    .proj-card:hover{border-color:var(--accent)}
    .proj-tech{font-size:.75rem;color:var(--accent);font-weight:700;margin:.3rem 0 .5rem}
    .proj-desc{font-size:.85rem;color:var(--text-secondary);line-height:1.5}
    .timeline-item{
      border-left:2px solid var(--accent);padding-left:1rem;
      margin-bottom:1.1rem;display:flex;flex-direction:column;gap:.2rem;
    }
    .tl-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:.25rem}
    .tl-role{font-weight:700;font-size:.95rem}
    .tl-date{font-size:.78rem;color:var(--text-muted)}
    .tl-company{font-size:.85rem;color:var(--accent);font-weight:600}
    .tl-desc{font-size:.85rem;color:var(--text-secondary);margin-top:.3rem;line-height:1.5}

    /* ─── Buttons ─── */
    .btn{
      display:inline-flex;align-items:center;gap:.45rem;
      padding:.55rem 1.1rem;border-radius:8px;font-size:.875rem;font-weight:700;
      cursor:pointer;border:1.5px solid transparent;outline:none;
      transition:all .2s cubic-bezier(.4,0,.2,1);white-space:nowrap;
    }
    .btn-primary{background:var(--accent-grad);color:#fff;box-shadow:0 4px 12px var(--accent-glow)}
    .btn-primary:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 6px 18px var(--accent-glow)}
    .btn-secondary{background:var(--bg-card);color:var(--text-primary);border-color:var(--border)}
    .btn-secondary:hover{border-color:var(--accent);color:var(--accent)}
    .btn-danger{background:rgba(239,68,68,.12);color:#ef4444;border-color:rgba(239,68,68,.3)}
    .btn-danger:hover{background:rgba(239,68,68,.22)}
    .btn-success{background:var(--success);color:var(--success-text);border-color:rgba(16,185,129,.3)}
    .btn-sm{padding:.32rem .65rem;font-size:.78rem}
    .btn-lg{padding:.7rem 1.5rem;font-size:1rem}

    /* ─── Analytics Badge ─── */
    .analytics-badge{
      display:flex;align-items:center;gap:.6rem;
      background:var(--bg-card);border:1px solid var(--badge-border);
      padding:.38rem .8rem;border-radius:20px;font-size:.78rem;font-weight:700;
    }
    .pulse{
      width:8px;height:8px;border-radius:50%;
      background:#10b981;box-shadow:0 0 10px #10b981;
      animation:pulse 2s infinite;flex-shrink:0;
    }
    @keyframes pulse{
      0%{transform:scale(.95);box-shadow:0 0 0 0 rgba(16,185,129,.7)}
      70%{transform:scale(1);box-shadow:0 0 0 5px rgba(16,185,129,0)}
      100%{transform:scale(.95);box-shadow:0 0 0 0 rgba(16,185,129,0)}
    }

    /* ─── Theme Selector ─── */
    .theme-sel{
      display:flex;align-items:center;gap:.4rem;
      background:var(--bg-card);border:1.5px solid var(--border);
      padding:.38rem .75rem;border-radius:8px;
    }
    .theme-sel select{
      background:transparent;border:none;box-shadow:none;
      padding:0;font-size:.82rem;font-weight:700;width:auto;
      color:var(--text-primary);cursor:pointer;
    }
    .theme-sel select:focus{border:none;box-shadow:none}

    /* ─── Modal ─── */
    .modal-bg{
      position:fixed;inset:0;background:rgba(0,0,0,.75);
      backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;
      z-index:9999;padding:1rem;
    }
    .modal-box{
      background:var(--bg-surface);border:1px solid var(--border);
      border-radius:18px;padding:2rem;max-width:440px;width:100%;
      display:flex;flex-direction:column;align-items:center;gap:1.2rem;
      box-shadow:0 24px 60px rgba(0,0,0,.5);
    }
    .modal-title{font-size:1.3rem;font-weight:800}
    .modal-sub{font-size:.85rem;color:var(--text-secondary);text-align:center;line-height:1.5}
    .qr-frame{background:#fff;padding:1rem;border-radius:12px;display:inline-block}

    /* ─── Toasts ─── */
    .toast-stack{position:fixed;bottom:1.5rem;right:1.5rem;z-index:10000;display:flex;flex-direction:column;gap:.5rem;max-width:320px}
    .toast{
      background:var(--bg-surface);border:1px solid var(--accent);
      padding:.7rem 1.1rem;border-radius:10px;font-size:.84rem;font-weight:600;
      display:flex;align-items:center;gap:.6rem;
      box-shadow:0 8px 24px var(--shadow);
      animation:slideIn .3s cubic-bezier(.4,0,.2,1);
    }
    .toast-error{border-color:var(--error-text)}
    @keyframes slideIn{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}

    /* ─── Empty / Loading States ─── */
    .empty-state{
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:.85rem;padding:3rem 1rem;text-align:center;color:var(--text-secondary);
    }
    .empty-icon{font-size:3rem;opacity:.5}
    .skeleton{background:linear-gradient(90deg,var(--border) 0%,var(--bg-card) 50%,var(--border) 100%);background-size:200%;border-radius:6px;animation:shimmer 1.5s infinite}
    @keyframes shimmer{to{background-position:-200%}}

    /* ─── Validation alert inline ─── */
    .validation-banner{
      background:var(--error);border:1px solid rgba(239,68,68,.3);
      border-radius:8px;padding:.75rem 1rem;font-size:.83rem;color:var(--error-text);

// ═════════════════════════════════════════════════════════
// DATA LAYER — Browser LocalStorage Draft Persistence
// ═════════════════════════════════════════════════════════
const DRAFT_KEY = 'cloudfolio_resume_draft_v2';
const ANALYTICS_KEY = 'cloudfolio_analytics_v2';

function saveDraft(data) {
  try {
    localStorage.setItem(DRAFT_KEY, JSON.stringify({ data, ts: Date.now() }));
    return true;
  } catch { return false; }
}

function loadDraft() {
  try {
    const raw = localStorage.getItem(DRAFT_KEY);
    return raw ? JSON.parse(raw).data : null;
  } catch { return null; }
}

function getSessionAnalytics() {
  try {
    const raw = localStorage.getItem(ANALYTICS_KEY);
    return raw ? JSON.parse(raw) : { views: 0, downloads: 0 };
  } catch { return { views: 0, downloads: 0 }; }
}

function updateSessionAnalytics(type) {
  const a = getSessionAnalytics();
  if (type === 'view') a.views++;
  else if (type === 'download') a.downloads++;
  try { localStorage.setItem(ANALYTICS_KEY, JSON.stringify(a)); } catch {}

  // /api/analytics is a Vercel Serverless Function — it only runs under Vercel's
  // infrastructure, not under Python's http.server (which returns 501 for POST).
  // On localhost we rely entirely on the localStorage session counter above.
  // On Vercel (production), the fetch fires and the serverless function handles it.
  const isLocalDev = (
    location.hostname === 'localhost' ||
    location.hostname === '127.0.0.1' ||
    location.hostname === ''
  );
  if (!isLocalDev) {
    const action = type === 'view' ? 'increment_views' : 'increment_downloads';
    fetch('/api/analytics', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action })
    }).catch(() => {
      // Silently ignore network failures — localStorage counter is already updated.
    });
  }

  return a;
}

function validatePersonal(p) {
  const errors = {};
  if (!p.fullName.trim()) errors.fullName = 'Full name is required.';
  if (!p.email.trim()) errors.email = 'Email is required.';
  else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(p.email)) errors.email = 'Enter a valid email address.';
  if (p.phone && !/^[+\d\s\-().]{7,20}$/.test(p.phone)) errors.phone = 'Enter a valid phone number.';
  if (p.github && !/^https?:\/\//.test(p.github)) errors.github = 'Must be a full URL (https://…)';
  if (p.linkedin && !/^https?:\/\//.test(p.linkedin)) errors.linkedin = 'Must be a full URL (https://…)';
  return errors;
}

// ACTION VERB ENHANCER (Rule-based — NOT AI)
// ═════════════════════════════════════════════════════════
const ACTION_VERBS = [
  'Architected and deployed','Engineered high-performance','Streamlined and optimized',
  'Automated end-to-end','Accelerated delivery of','Led the development of',
  'Designed and implemented','Built and maintained',
];
function enhanceBulletWithActionVerbs(text) {
  if (!text || text.trim().length < 4) return text;
  const words = text.trim().split(' ');
  const verb = ACTION_VERBS[Math.floor(Math.random() * ACTION_VERBS.length)];
  const body = words.length <= 3 ? words.join(' ').toLowerCase() : words.slice(1).join(' ');
  return `${verb} ${body}.`;
}

function ExperienceForm({ data, onChange }) {
  const add = () => onChange([...data, {

  }]);
  const remove = id => onChange(data.filter(e => e.id !== id));
  const update = (id, field, val) => onChange(data.map(e => e.id===id ? {...e,[field]:val} : e));
  const updateHL = (id, idx, val) => {
    const exp = data.find(e => e.id===id);
    const h = [...exp.highlights]; h[idx] = val;
    update(id, 'highlights', h);
  };
  const addHL = id => {
    const exp = data.find(e => e.id===id);
    update(id, 'highlights', [...exp.highlights, '']);

    const exp = data.find(e => e.id===id);
    update(id, 'highlights', exp.highlights.filter((_,i)=>i!==idx));

    const exp = data.find(e => e.id===id);
    update(id, field, enhanceBulletWithActionVerbs(exp[field]));

function Builder({ data, onChange, activeTheme, onThemeChange, onDownload, onShare, analytics }) {
  const [tab, setTab] = React.useState('personal');
  const [viewMode, setViewMode] = React.useState('resume');
  const [personalErrors, setPersonalErrors] = React.useState({});
  const [saveStatus, setSaveStatus] = React.useState('All changes saved locally');

  const tabs = [
    {id:'personal', label:'👤 Personal'},
    {id:'experience', label:`💼 Experience (${data.experience.length})`},
    {id:'education', label:`🎓 Education (${data.education.length})`},
    {id:'skills', label:`⚡ Skills (${data.skills.length})`},
    {id:'projects', label:`🚀 Projects (${data.projects.length})`},
    {id:'certifications', label:`🏆 Certs (${data.certifications.length})`},
    {id:'achievements', label:`⭐ Achievements (${data.achievements.filter(a=>a.trim()).length})`},
  ];

  const handleChange = (newData) => {
    // Validate personal when on that tab
    if (tab === 'personal') setPersonalErrors(validatePersonal(newData.personal));
    onChange(newData);
    setSaveStatus('Saving…');
    setTimeout(() => setSaveStatus('✓ Draft saved locally'), 600);
  };

  return (
    <div className="builder">
      {/* ── LEFT: EDITOR ── */}
      <div className="editor-panel">
        <div className="tab-bar" role="tablist" aria-label="Resume section tabs">
          {tabs.map(t => (
            <button key={t.id} className={`tab-btn ${tab===t.id?'active':''}`}
              role="tab" aria-selected={tab===t.id} onClick={()=>setTab(t.id)}>
              {t.label}
            </button>
          ))}
        </div>
        <div className="form-scroll" role="tabpanel">
          {tab==='personal'      && <PersonalForm data={data.personal} errors={personalErrors}
              onChange={p => handleChange({...data, personal:p})} />}
          {tab==='experience'    && <ExperienceForm data={data.experience}
              onChange={v => handleChange({...data, experience:v})} />}
          {tab==='education'     && <EducationForm data={data.education}
              onChange={v => handleChange({...data, education:v})} />}
          {tab==='skills'        && <SkillsForm data={data.skills}
              onChange={v => handleChange({...data, skills:v})} />}
          {tab==='projects'      && <ProjectsForm data={data.projects}
              onChange={v => handleChange({...data, projects:v})} />}
          {tab==='certifications'&& <CertificationsForm data={data.certifications}
              onChange={v => handleChange({...data, certifications:v})} />}
          {tab==='achievements'  && <AchievementsForm data={data.achievements}
              onChange={v => handleChange({...data, achievements:v})} />}
        </div>
        <div style={{padding:'.55rem 1rem',borderTop:'1px solid var(--border)',background:'var(--bg-base)'}}>
          <span className="save-status">💾 {saveStatus}</span>
        </div>
      </div>

      {/* ── RIGHT: PREVIEW ── */}
      <div className="preview-panel">
        <div className="preview-bar">
          <div className="preview-bar-left">
            <span style={{fontSize:'.85rem',fontWeight:700}}>Live Preview</span>
            <span className="preview-badge">{viewMode==='resume'?'A4 Document':'Web Portfolio'}</span>
          </div>
          <div className="view-toggle" role="group" aria-label="Preview mode">
            <button className={`vt-btn ${viewMode==='resume'?'active':''}`}
              onClick={()=>setViewMode('resume')} aria-pressed={viewMode==='resume'}>
              📄 Resume
            </button>
            <button className={`vt-btn ${viewMode==='portfolio'?'active':''}`}
              onClick={()=>setViewMode('portfolio')} aria-pressed={viewMode==='portfolio'}>
              🌐 Portfolio
            </button>
          </div>
        </div>
        <div className="preview-scroll">
          {viewMode==='resume'
            ? <ResumeView data={data} />
            : <PortfolioView data={data} />
          }
        </div>
      </div>
    </div>
  );
}

  const [activeTheme, setActiveTheme] = React.useState(() => (loadDraft() || DEFAULT_DATA).activeTheme || 'dark-glass');
  const [analytics, setAnalytics] = React.useState(() => getSessionAnalytics());
  const [toasts, setToasts] = React.useState([]);
  const [showQR, setShowQR] = React.useState(false);

  // Apply theme to <html>
  React.useEffect(() => {
    document.documentElement.setAttribute('data-theme', activeTheme);
  }, [activeTheme]);

  // Track page view on mount
  React.useEffect(() => {
    setAnalytics(updateSessionAnalytics('view'));
  }, []);

  const addToast = (message, type='success') => {
    const id = Date.now() + Math.random();
    setToasts(prev => [...prev, { id, message, type }]);
    setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3500);
  };

  const handleDataChange = (newData) => {
    setResumeData(newData);
    saveDraft(newData);
  };

  const handleThemeChange = (t) => {
    setActiveTheme(t);
    handleDataChange({ ...resumeData, activeTheme: t });
    addToast(`🎨 Theme changed to ${t === 'dark-glass' ? 'Dark Glass' : t === 'corporate' ? 'Corporate Light' : 'Cyber Neon'}`);
  };

  const handleDownload = () => {
    const updated = updateSessionAnalytics('download');
    setAnalytics(updated);
    addToast('📄 Opening PDF export dialog…');
    setTimeout(() => window.print(), 350);
  };

  const handleNavigate = (p) => {
    setPage(p);
    window.scrollTo(0,0);
  };

  const shareUrl = window.location.href;

  return (
    <>
      <Navbar
        page={page}
        onNavigate={handleNavigate}
        activeTheme={activeTheme}
        onThemeChange={handleThemeChange}
        analytics={analytics}
        onDownload={handleDownload}
        onShare={() => setShowQR(true)}
      />

      {page === 'landing' && <Landing onStart={() => handleNavigate('builder')} />}
      {page === 'builder' && (
        <Builder
          data={resumeData}
          onChange={handleDataChange}
          activeTheme={activeTheme}
          onThemeChange={handleThemeChange}
          onDownload={handleDownload}
          onShare={() => setShowQR(true)}
          analytics={analytics}
        />
      )}

      {showQR && (
        <QRModal url={shareUrl} onClose={() => setShowQR(false)} onToast={addToast} />
      )}

      <ToastContainer toasts={toasts} />
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
